# Render Blueprint — https://render.com/docs/blueprint-spec
#
# IMPORTANT: the free plan does NOT support persistent disks. Without the
# `disk` section below (or on the free plan, where it is ignored), the
# SQLite database and every uploaded file / locked document are wiped on
# every deploy and periodic restart. That is fine for a demo, but the
# system's own design doc requires keeping signed reports for 10+ years —
# do not use this for real report data without a paid plan and the disk
# attached.
services:
  - type: web
    name: research-report-system
    env: node
    plan: free # change to "starter" (or higher) to use the persistent disk below
    buildCommand: "true"
    startCommand: node server.js
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: NODE_ENV
        value: production
    disk:
      name: research-report-data
      mountPath: /var/data
      sizeGB: 1
