# Render Blueprint — https://render.com/docs/blueprint-spec
#
# ข้อมูลห้ามหายถาวร: ฐานข้อมูลทั้งหมด (ผลงาน ลิงก์ ลายเซ็น ประวัติเวอร์ชัน
# และไฟล์สำรอง) อยู่ในโฟลเดอร์เดียวคือ DATA_DIR ซึ่ง mount กับ persistent disk
# ด้านล่าง ถ้าไม่มี disk นี้ (เช่นบนแผน free ที่ไม่รองรับ) พื้นที่เก็บข้อมูลจะเป็น
# แบบชั่วคราวและถูกล้างทุกครั้งที่ deploy ใหม่หรือเซิร์ฟเวอร์ restart
# แผน starter เป็นแผนต่ำสุดที่แนบ disk ได้ จึงตั้งเป็นค่าเริ่มต้นไว้
services:
  - type: web
    name: research-report-system
    runtime: node
    plan: starter
    buildCommand: "true"
    startCommand: node server.js
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: NODE_ENV
        value: production
      # รหัสสำหรับเพิ่ม/แก้ไข/ลบ/รับรองผลงาน (ค่าเริ่มต้น 123456)
      # เปลี่ยนได้ที่หน้า "จัดการระบบ" ในเว็บ หรือกำหนดที่นี่
      - key: EDIT_PASSCODE
        value: "123456"
      - key: SCHOOL_NAME
        value: โรงเรียนเจ้าพ่อหลวงอุปถัมภ์ ๑
    disk:
      name: research-report-data
      mountPath: /var/data
      sizeGB: 1
